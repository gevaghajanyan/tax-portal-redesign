<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Tax Portal Redesign">
  <defs>
    <linearGradient id="tp-logo-bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <filter id="tp-logo-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded badge -->
  <rect width="128" height="128" rx="28" fill="url(#tp-logo-bg)"/>

  <!-- Three stacked content bars decreasing in width -->
  <g filter="url(#tp-logo-shadow)">
    <rect x="30" y="42" width="56" height="10" rx="5" fill="#ffffff"/>
    <rect x="30" y="60" width="42" height="10" rx="5" fill="#ffffff" fill-opacity="0.78"/>
    <rect x="30" y="78" width="48" height="10" rx="5" fill="#ffffff" fill-opacity="0.56"/>
  </g>

  <!-- Accent dot (reads as "modern/active") -->
  <circle cx="94" cy="47" r="6" fill="#ffffff"/>
</svg>
